# Production uchun override fayli.
# Ishlatish: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# CI/CD pipeline shu faylni ishlatib, GHCR'dan tayyor image'larni pull qiladi
# (local build qilmaydi — build allaqachon CI bosqichida bajarilgan).

services:
  db:
    ports: []  # production'da DB portini tashqariga ochmaymiz
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build: null
    image: ${BACKEND_IMAGE}
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MODEL_PATH: app/ml/best.pt
      CONFIDENCE_THRESHOLD: 0.35
      DEVICE: cpu
      CORS_ORIGINS: ${CORS_ORIGINS}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    deploy:
      resources:
        limits:
          memory: 2G

  frontend:
    build: null
    image: ${FRONTEND_IMAGE}
    deploy:
      resources:
        limits:
          memory: 128M
